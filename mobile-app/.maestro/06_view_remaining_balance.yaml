appId: com.pocketed.app
name: View Remaining Balance
tags:
  - acceptance
  - balance
---
# Seed: budget 200€, expense 50€, income 1000€ -> remaining 150€, balance 950€.
- runFlow:
    file: setup/seed_user.yaml

# Budget.
- tapOn:
    id: "dashboard-add-budget-button"
- tapOn:
    id: "budget-category-input"
- inputText: "Food"
- tapOn:
    id: "budget-limit-input"
- inputText: "200"
- hideKeyboard
- tapOn:
    id: "budget-save-button"

# Expense.
- tapOn:
    id: "dashboard-add-expense-button"
- tapOn:
    id: "expense-title-input"
- inputText: "Groceries"
- tapOn:
    id: "expense-amount-input"
- inputText: "50"
- tapOn:
    id: "expense-category-input"
- inputText: "Food"
- hideKeyboard
- tapOn:
    id: "expense-save-button"

# Income.
- tapOn:
    id: "dashboard-add-income-button"
- tapOn:
    id: "income-category-salary"
- tapOn:
    id: "income-amount-input"
- inputText: "1000"
- hideKeyboard
- tapOn:
    id: "income-save-button"

# Verify dashboard summary.
- assertVisible:
    id: "dashboard-balance-value"
- assertVisible:
    id: "dashboard-spent-value"
- assertVisible:
    id: "dashboard-income-value"
- assertVisible:
    id: "dashboard-remaining-value"

# Remaining = budget(200) - spent(50) = 150€. Currency uses "150,00" formatting.
- assertVisible: ".*150.*"
