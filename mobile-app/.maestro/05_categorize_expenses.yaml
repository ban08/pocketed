appId: com.pocketed.app
name: Categorize Expenses
tags:
  - acceptance
  - category
---
- runFlow:
    file: setup/seed_user.yaml

# First expense in Food.
- tapOn:
    id: "dashboard-add-expense-button"
- tapOn:
    id: "expense-title-input"
- inputText: "Lunch"
- tapOn:
    id: "expense-amount-input"
- inputText: "12"
- tapOn:
    id: "expense-category-input"
- inputText: "Food"
- hideKeyboard
- tapOn:
    id: "expense-save-button"

# Second expense in Transport.
- tapOn:
    id: "dashboard-add-expense-button"
- tapOn:
    id: "expense-title-input"
- inputText: "Bus"
- tapOn:
    id: "expense-amount-input"
- inputText: "3"
- tapOn:
    id: "expense-category-input"
- inputText: "Transport"
- hideKeyboard
- tapOn:
    id: "expense-save-button"

# Recent transactions show both items with their categories.
- assertVisible: "Lunch"
- assertVisible: "Food"
- assertVisible: "Bus"
- assertVisible: "Transport"
