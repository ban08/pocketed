appId: com.pocketed.app
name: View Financial Statistics
tags:
  - acceptance
  - statistics
  - implemented
---
# Checks View Financial Statistics on the dashboard.
- launchApp:
    clearState: true
- tapOn: "Continue as guest"
- assertVisible: "Spent this month"
- assertVisible: "62%"
- assertVisible: "Recent Transactions"
- assertVisible: "See all"
- scrollUntilVisible:
    element: "Budget Overview"
    direction: DOWN
- assertVisible: "Budget Overview"
- assertVisible: "Manage"
- assertVisible: "Food & Dining"
