appId: com.pocketed.app
name: Profile and Logout Session
tags:
  - acceptance
  - profile
  - session
env:
  USER_NAME: "Maestro Tester"
  USER_EMAIL: "maestro@example.com"
---
- runFlow:
    file: setup/seed_user.yaml

# Open profile from the dashboard avatar.
- tapOn:
    id: "dashboard-profile-button"

- assertVisible: "My Profile"
- assertVisible: ${USER_NAME}
- assertVisible: ${USER_EMAIL}

# Sign out routes to login.
- tapOn:
    id: "profile-sign-out-button"
- assertVisible:
    id: "login-submit-button"

# Relaunch the app: should NOT auto-authenticate. The root layout routes back
# to welcome when there is no current_user in storage.
- launchApp:
    clearState: false
- assertVisible:
    id: "welcome-login-button"
