appId: com.pocketed.app
name: View Financial Statistics
tags:
  - acceptance
  - statistics
---
- runFlow:
    file: setup/seed_user.yaml

# Add one income and one expense so the dashboard has real numbers.
- tapOn:
    id: "dashboard-add-income-button"
- tapOn:
    id: "income-category-salary"
- tapOn:
    id: "income-amount-input"
- inputText: "2000"
- hideKeyboard
- tapOn:
    id: "income-save-button"

- tapOn:
    id: "dashboard-add-expense-button"
- tapOn:
    id: "expense-title-input"
- inputText: "Books"
- tapOn:
    id: "expense-amount-input"
- inputText: "75"
- tapOn:
    id: "expense-category-input"
- inputText: "Education"
- hideKeyboard
- tapOn:
    id: "expense-save-button"

# Dashboard summary cards must all render.
- assertVisible:
    id: "dashboard-income-value"
- assertVisible:
    id: "dashboard-spent-value"
- assertVisible:
    id: "dashboard-balance-value"
- assertVisible:
    id: "dashboard-remaining-value"

# Profile summary should mirror dashboard values.
- tapOn:
    id: "dashboard-profile-button"
- assertVisible: "Financial Summary"
- assertVisible: "Income"
- assertVisible: "Spent"
- assertVisible: "Balance"
