appId: com.pocketed.app
name: Seed User (subflow)
tags:
  - setup
# Registers and logs in a user. Pass unique credentials with:
#   maestro -e USER_EMAIL=alice+$(date +%s)@example.com -e USER_NAME="Alice"
#           -e USER_PASSWORD="secret123" test .maestro/01_auth_register_login.yaml
# Defaults are useful for local smoke runs against an empty test backend.
env:
  USER_NAME: "Maestro Tester"
  USER_EMAIL: "maestro@example.com"
  USER_PASSWORD: "secret123"
---
- launchApp:
    clearState: true

# Welcome -> Register
- tapOn:
    id: "welcome-register-button"

# Fill the registration form using stable testIDs.
- tapOn:
    id: "register-name-input"
- inputText: ${USER_NAME}
- tapOn:
    id: "register-email-input"
- inputText: ${USER_EMAIL}
- tapOn:
    id: "register-password-input"
- inputText: ${USER_PASSWORD}
- tapOn:
    id: "register-confirm-password-input"
- inputText: ${USER_PASSWORD}
- hideKeyboard
- tapOn:
    id: "register-submit-button"

# Register navigates to /auth/login with the email prefilled.
- assertVisible:
    id: "login-submit-button"
- tapOn:
    id: "login-password-input"
- inputText: ${USER_PASSWORD}
- hideKeyboard
- tapOn:
    id: "login-submit-button"

# Land on the dashboard.
- assertVisible:
    id: "dashboard-add-expense-button"
