appId: com.pocketed.app
name: Add Expense Record
tags:
  - acceptance
  - expense
env:
  EXPENSE_TITLE: "Coffee"
  EXPENSE_AMOUNT: "5"
  EXPENSE_CATEGORY: "Food"
---
- runFlow:
    file: setup/seed_user.yaml

- tapOn:
    id: "dashboard-add-expense-button"

- tapOn:
    id: "expense-title-input"
- inputText: ${EXPENSE_TITLE}

- tapOn:
    id: "expense-amount-input"
- inputText: ${EXPENSE_AMOUNT}

- tapOn:
    id: "expense-category-input"
- inputText: ${EXPENSE_CATEGORY}
- hideKeyboard

- tapOn:
    id: "expense-save-button"

# Back on dashboard: spent value visible and shows €5.
- assertVisible:
    id: "dashboard-spent-value"
- assertVisible: ".*5,00.*"
- assertVisible: ${EXPENSE_TITLE}
