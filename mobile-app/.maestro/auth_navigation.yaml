appId: com.pocketed.app
name: Authentication Navigation
tags:
  - acceptance
  - auth
  - implemented
---
# Checks welcome, login, and register navigation.
- launchApp:
    clearState: true
- assertVisible: "Get Started"
- assertVisible: "Register"
- assertVisible: "Login"
- assertVisible: "Continue as guest"

- tapOn: "Login"
- assertVisible: "Welcome back.*"
- assertVisible: "^Email$"
- assertVisible: "^Password$"
- assertVisible:
    text: "Let.*Go.*"

- tapOn: "Back to welcome screen"
- assertVisible: "Get Started"

- tapOn: "Register"
- assertVisible: "Join the crew.*"
- assertVisible: "^Name$"
- assertVisible: "Confirm Password"
- assertVisible:
    text: "Create Account.*"
