appId: com.pocketed.app
name: Add Income Record
tags:
  - acceptance
  - income
env:
  INCOME_TITLE: "Salary"
  INCOME_AMOUNT: "1500"
---
- runFlow:
    file: setup/seed_user.yaml

- tapOn:
    id: "dashboard-add-income-button"

# The Salary quick-pick auto-fills the title field.
- tapOn:
    id: "income-category-salary"

- tapOn:
    id: "income-title-input"
- eraseText: 64
- inputText: ${INCOME_TITLE}

- tapOn:
    id: "income-amount-input"
- inputText: ${INCOME_AMOUNT}
- hideKeyboard

- tapOn:
    id: "income-save-button"

# Back on dashboard: the income value should reflect 1500€.
# Currency is rendered via toLocaleString("de-DE") so the string contains "1.500".
- assertVisible:
    id: "dashboard-income-value"
- assertVisible: ".*1\\.500.*"
- assertVisible: ${INCOME_TITLE}
